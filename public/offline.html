<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Kamkaj</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/pwa-icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#d97706">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #d97706;
            --accent-hover: #b45309;
            --accent-glow: rgba(217, 119, 6, 0.25);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fafc;
                --card-bg: rgba(255, 255, 255, 0.85);
                --card-border: rgba(226, 232, 240, 0.8);
                --text-primary: #0f172a;
                --text-secondary: #64748b;
                --accent: #d97706;
                --accent-hover: #b45309;
                --accent-glow: rgba(217, 119, 6, 0.15);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* Ambient background glow */
        .ambient-glow {
            position: absolute;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(40px);
        }

        .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 1.25rem;
            padding: 2.5rem 2rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo-wrap {
            margin-bottom: 1.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo-img {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            box-shadow: 0 8px 20px -4px var(--accent-glow);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.8125rem;
            font-weight: 500;
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-bottom: 1.25rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        h1 {
            font-size: 1.625rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.625rem;
        }

        p {
            font-size: 0.9375rem;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 1.75rem;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9375rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
            text-decoration: none;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
            padding: 0.65rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--card-border);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .connection-status {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.8;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="card">
        <div class="logo-wrap">
            <img src="/pwa-icons/icon-192x192.png" alt="Kamkaj" class="logo-img">
        </div>

        <div class="status-badge" id="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">No Internet Connection</span>
        </div>

        <h1>You're Offline</h1>
        <p>
            Kamkaj cannot reach the server right now. Once your network connection is restored, the application will automatically reconnect.
        </p>

        <div class="actions">
            <button class="btn-primary" id="retry-btn" onclick="retryConnection()">
                <svg id="retry-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
                <span id="retry-text">Try Again</span>
            </button>
            <a href="/kamkaj" class="btn-secondary">
                Return to Dashboard
            </a>
        </div>

        <div class="connection-status" id="connection-status">
            Checking status in background...
        </div>
    </div>

    <script>
        function checkOnline() {
            if (navigator.onLine) {
                updateStatus(true);
                window.location.reload();
            } else {
                updateStatus(false);
            }
        }

        function updateStatus(isOnline) {
            var badge = document.getElementById('status-badge');
            var dot = document.getElementById('status-dot');
            var text = document.getElementById('status-text');
            var statusMsg = document.getElementById('connection-status');

            if (isOnline) {
                badge.style.background = 'rgba(34, 197, 94, 0.12)';
                badge.style.color = '#22c55e';
                badge.style.borderColor = 'rgba(34, 197, 94, 0.2)';
                dot.style.backgroundColor = '#22c55e';
                text.textContent = 'Connection Restored!';
                statusMsg.textContent = 'Reloading Kamkaj...';
            } else {
                badge.style.background = 'rgba(239, 68, 68, 0.12)';
                badge.style.color = '#ef4444';
                badge.style.borderColor = 'rgba(239, 68, 68, 0.2)';
                dot.style.backgroundColor = '#ef4444';
                text.textContent = 'No Internet Connection';
                statusMsg.textContent = 'Waiting for connection...';
            }
        }

        function retryConnection() {
            var btn = document.getElementById('retry-btn');
            var icon = document.getElementById('retry-icon');
            var text = document.getElementById('retry-text');

            icon.classList.add('spin');
            text.textContent = 'Checking...';
            btn.disabled = true;

            fetch('/favicon.ico?t=' + Date.now(), { cache: 'no-store', mode: 'no-cors' })
                .then(function() {
                    updateStatus(true);
                    setTimeout(function() {
                        window.location.reload();
                    }, 400);
                })
                .catch(function() {
                    updateStatus(false);
                    setTimeout(function() {
                        icon.classList.remove('spin');
                        text.textContent = 'Try Again';
                        btn.disabled = false;
                    }, 600);
                });
        }

        window.addEventListener('online', function() {
            updateStatus(true);
            setTimeout(function() {
                window.location.reload();
            }, 500);
        });

        window.addEventListener('offline', function() {
            updateStatus(false);
        });
    </script>
</body>
</html>
